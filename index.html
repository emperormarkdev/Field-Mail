<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Write field reports offline and send them as email text and printable PDF." />
    <title>Fieldmail</title>

    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1d4ed8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fieldmail" />
    <meta name="format-detection" content="telephone=no" />

    <script>
      (function () {
        try {
          var stored =
            localStorage.getItem('fieldmail-theme') ||
            localStorage.getItem('sitereport-theme');
          var dark =
            stored === 'dark' ||
            (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          var meta = document.querySelector('meta[name="color-scheme"]');
          if (meta) meta.setAttribute('content', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full">
      <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#2563eb 0%,#1d4ed8 55%,#1e3a8a 100%);"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
